<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Happy Mother's Day!</title>
<style>
  :root {
    --cream: #fff7ec;
    --ink: #2a2730;
    --pink: #ff6b9a;
    --pink-deep: #e3477a;
    --sky-1: #b9e3ff;
    --sky-2: #eaf6ff;
    --grass-1: #7dc66a;
    --grass-2: #5aa849;
    --skin: #fbd0b1;
    --skin-shade: #e8a884;
    --skin-light: #ffe6d4;
    --red: #e23b3b;
    --red-dark: #a92020;
    --orange: #ff8a2a;
    --orange-dark: #c25c00;
    --yellow: #ffd23a;
    --yellow-dark: #c89400;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream); color: var(--ink);
    font-family: "Marker Felt", "Comic Sans MS", "Chalkboard SE", "Bradley Hand", cursive, system-ui, sans-serif;
    min-height: 100%; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(circle at 20% 10%, #ffe2ec 0, transparent 40%),
      radial-gradient(circle at 80% 90%, #ffeac2 0, transparent 40%),
      var(--cream);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px;
  }
  #app { width: 100%; max-width: 860px; }

  .card {
    background: #fffdfa;
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 12px 0 rgba(42,39,48,0.12), 0 24px 60px rgba(42,39,48,0.18);
    overflow: hidden; position: relative;
  }
  .stage {
    position: relative; width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--sky-2); overflow: hidden;
  }
  .stage > svg.bg {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  .panel {
    padding: 16px 18px 22px;
    background: #fffdfa;
    border-top: 4px solid var(--ink);
  }
  .dialogue {
    font-size: 22px; line-height: 1.25;
    text-align: center; margin: 4px 0 14px; min-height: 1.4em;
  }
  .choices { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  button.choice, button.big {
    appearance: none; border: 3px solid var(--ink);
    background: var(--pink); color: #fff;
    font-family: inherit; font-size: 22px;
    padding: 14px 22px; border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--pink-deep);
    transition: transform 80ms ease, box-shadow 80ms ease;
    min-width: 160px;
  }
  button.choice:hover, button.big:hover { transform: translateY(-1px); }
  button.choice:active, button.big:active {
    transform: translateY(3px); box-shadow: 0 2px 0 var(--pink-deep);
  }
  button.choice.alt {
    background: var(--yellow); color: var(--ink);
    box-shadow: 0 5px 0 var(--yellow-dark);
  }
  button.choice.alt:active { box-shadow: 0 2px 0 var(--yellow-dark); }
  button.choice:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Intro ---------- */
  .intro { text-align: center; padding: 28px 22px 32px; }
  .intro h1 {
    font-size: clamp(34px, 6vw, 54px);
    margin: 6px 0 4px; color: var(--pink-deep);
    text-shadow: 3px 3px 0 var(--yellow);
  }
  .intro h2 {
    font-size: clamp(20px, 3vw, 26px);
    margin: 0 0 18px; color: var(--ink); font-weight: normal;
  }
  .intro .picker {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-top: 14px;
  }
  .pick {
    border: 3px solid var(--ink); border-radius: 22px;
    padding: 14px 10px 16px; background: #fffdfa;
    cursor: pointer; box-shadow: 0 5px 0 rgba(42,39,48,0.18);
    transition: transform 80ms ease, box-shadow 80ms ease, background 120ms ease;
    font-family: inherit; color: var(--ink);
  }
  .pick:hover { background: #fff3df; }
  .pick:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(42,39,48,0.18); }
  .pick svg { width: 100%; height: 110px; display: block; }
  .pick .label { font-size: 22px; margin-top: 6px; }

  /* ---------- Bubbles ---------- */
  .bubbles { position: absolute; inset: 0; pointer-events: none; }
  .bubble {
    position: absolute; background: #fff;
    border: 3px solid var(--ink); border-radius: 22px;
    padding: 8px 14px; font-size: 24px; font-weight: bold;
    color: var(--pink-deep); transform: scale(0);
    transform-origin: bottom center;
    animation: pop 360ms cubic-bezier(.18,1.3,.5,1) forwards;
    box-shadow: 0 4px 0 rgba(42,39,48,0.15);
    white-space: nowrap;
  }
  .bubble.big { font-size: 32px; color: var(--ink); }
  .bubble.small { font-size: 18px; }
  .bubble::after {
    content: ""; position: absolute;
    bottom: -12px; left: 22px;
    width: 16px; height: 16px; background: #fff;
    border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
    transform: rotate(45deg);
  }
  @keyframes pop {
    0%   { transform: scale(0) translateY(8px); }
    70%  { transform: scale(1.08) translateY(-2px); }
    100% { transform: scale(1) translateY(0); }
  }

  /* ---------- FX ---------- */
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .heart, .conf {
    position: absolute; bottom: -40px;
    will-change: transform, opacity;
    animation: float 3.6s linear infinite;
  }
  .heart { font-size: 28px; }
  .conf { width: 10px; height: 14px; border-radius: 2px; }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
  }

  /* ---------- Characters ---------- */
  .actor {
    position: absolute; bottom: 0;
    transform-origin: 50% 100%;
    transition: left .4s cubic-bezier(.4,0,.2,1), bottom .4s cubic-bezier(.4,0,.2,1);
  }
  .actor svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* face states — alternate mouths/eyes for expressions */
  .actor .mouth-open, .actor .mouth-wide, .actor .eyes-closed, .actor .eyes-wide { display: none; }
  /* cheer pose auto-shows happy face */
  .actor.cheer .mouth-closed,
  .actor[data-face="cheer"]    .mouth-closed { display: none; }
  .actor.cheer .mouth-wide,
  .actor[data-face="cheer"]    .mouth-wide   { display: inline; }
  .actor.cheer .eyes-normal,
  .actor[data-face="cheer"]    .eyes-normal  { display: none; }
  .actor.cheer .eyes-closed,
  .actor[data-face="cheer"]    .eyes-closed  { display: inline; }
  .actor[data-face="surprise"] .mouth-closed { display: none; }
  .actor[data-face="surprise"] .mouth-open   { display: inline; }
  .actor[data-face="surprise"] .eyes-normal  { display: none; }
  .actor[data-face="surprise"] .eyes-wide    { display: inline; }
  .actor[data-face="effort"]   .mouth-closed { display: none; }
  .actor[data-face="effort"]   .mouth-open   { display: inline; }
  /* running pose: slightly open mouth (effort) */
  .actor.running .mouth-closed { display: none; }
  .actor.running .mouth-open   { display: inline; }

  /* camera moves — push-in scales children, shake bumps the stage itself */
  .stage.cam-pushin > svg.bg, .stage.cam-pushin > .actor { animation: camPushin 3500ms ease-out forwards; }
  .stage.cam-shake { animation: camShake 320ms ease-in-out 2; }
  @keyframes camPushin { 0%{transform:scale(1);} 100%{transform:scale(1.06);} }
  @keyframes camShake  { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  /* impact flash overlay */
  .impact-flash {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at center, rgba(255,255,210,0.7) 0, transparent 60%);
    opacity: 0;
    animation: flashPulse 350ms ease-out forwards;
  }
  @keyframes flashPulse { 0%{opacity:0;} 30%{opacity:1;} 100%{opacity:0;} }

  /* idle bob */
  .actor.idle .body-rig { animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }

  /* run cycle */
  /* All limbs pivot from the joint (top of bbox = shoulder/hip) — fixes
     arms-fly-off when the SVG group's transform-origin is computed against
     the parent SVG's viewBox instead of its own bounding box. */
  .actor .arm-l, .actor .arm-r, .actor .leg-l, .actor .leg-r {
    transform-box: fill-box;
    transform-origin: 50% 0;
  }
  .actor .head { transform-box: fill-box; transform-origin: 50% 100%; }
  .actor .body-rig { transform-box: fill-box; transform-origin: 50% 100%; }

  .actor.running .body-rig { animation: runBob 380ms ease-in-out infinite; }
  .actor.running .leg-r { animation: legR 520ms cubic-bezier(.4,0,.6,1) infinite; }
  .actor.running .leg-l { animation: legL 520ms cubic-bezier(.4,0,.6,1) infinite; }
  .actor.running .arm-r { animation: armR 520ms cubic-bezier(.4,0,.6,1) infinite; }
  .actor.running .arm-l { animation: armL 520ms cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes runBob { 0%,100%{transform:translateY(0) scaleY(1);} 25%{transform:translateY(-4px) scaleY(1.03);} 50%{transform:translateY(0) scaleY(.97);} 75%{transform:translateY(-3px) scaleY(1.02);} }
  @keyframes legR { 0%,100%{transform:rotate(36deg);} 50%{transform:rotate(-36deg);} }
  @keyframes legL { 0%,100%{transform:rotate(-36deg);} 50%{transform:rotate(36deg);} }
  @keyframes armR { 0%,100%{transform:rotate(-40deg);} 50%{transform:rotate(40deg);} }
  @keyframes armL { 0%,100%{transform:rotate(40deg);} 50%{transform:rotate(-40deg);} }

  /* cheer — squash/stretch jump with arms up */
  .actor.cheer .arm-r { animation: cheerArmR 600ms ease-in-out infinite alternate; }
  .actor.cheer .arm-l { animation: cheerArmL 600ms ease-in-out infinite alternate; }
  .actor.cheer .body-rig { animation: cheerJump 700ms cubic-bezier(.4,0,.5,1) infinite; }
  .actor.cheer .head { animation: cheerHead 700ms ease-in-out infinite; }
  @keyframes cheerArmR { 0%{transform:rotate(-170deg);} 100%{transform:rotate(-140deg);} }
  @keyframes cheerArmL { 0%{transform:rotate(170deg);}  100%{transform:rotate(140deg);} }
  @keyframes cheerJump {
    0%   { transform: translateY(0)  scaleY(.92) scaleX(1.06); }
    25%  { transform: translateY(-6px) scaleY(1.08) scaleX(.95); }
    50%  { transform: translateY(-16px) scaleY(1.05) scaleX(.98); }
    75%  { transform: translateY(-6px) scaleY(1.02) scaleX(1.0); }
    100% { transform: translateY(0)  scaleY(.92) scaleX(1.06); }
  }
  @keyframes cheerHead {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%     { transform: translateY(-2px) rotate(2deg); }
  }

  /* wobble (for Sonny on ice etc.) */
  .actor.wobble { animation: wobble 1.2s ease-in-out infinite; }
  @keyframes wobble { 0%,100%{transform:rotate(-5deg);} 50%{transform:rotate(5deg);} }

  /* spin (figure skater) */
  .actor.spin .body-rig { animation: spinBody 1.6s linear infinite; }
  @keyframes spinBody { 0%{transform:scaleX(1);} 25%{transform:scaleX(.2);} 50%{transform:scaleX(-1);} 75%{transform:scaleX(-.2);} 100%{transform:scaleX(1);} }

  /* hockey wind-up (manually triggered with .windup class) */
  .actor.windup .arm-r { animation: hockeyWindup 1.4s ease-in-out forwards; }
  .actor.windup .arm-l { animation: hockeyWindupL 1.4s ease-in-out forwards; }
  @keyframes hockeyWindup { 0%{transform:rotate(-10deg);} 50%{transform:rotate(-110deg);} 70%{transform:rotate(-110deg);} 100%{transform:rotate(60deg);} }
  @keyframes hockeyWindupL { 0%{transform:rotate(10deg);} 50%{transform:rotate(-50deg);} 100%{transform:rotate(40deg);} }

  /* ball/puck */
  .ball, .puck {
    position: absolute; pointer-events: none;
    will-change: transform, left, top;
    transition: none;
  }
  .ball { width: 5%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0 28%, #e0e0e0 30% 60%, #888 62% 100%);
    border: 2px solid #1a1a1a; box-shadow: 0 6px 0 rgba(0,0,0,0.08);
  }
  .ball::before {
    content: ""; position: absolute; inset: 18%;
    background:
      radial-gradient(circle, #1a1a1a 26%, transparent 27%) 0 0/40% 40%,
      radial-gradient(circle, #1a1a1a 26%, transparent 27%) 50% 50%/40% 40%;
  }
  .puck { width: 4%; aspect-ratio: 1.6/1; border-radius: 50%;
    background: linear-gradient(180deg, #2c2c2c 0%, #000 100%);
    border: 2px solid #000;
  }
  .ball-shadow, .puck-shadow {
    position: absolute; pointer-events: none;
    width: 5%; height: 1.2%; border-radius: 50%;
    background: rgba(0,0,0,0.25); filter: blur(2px);
  }

  /* speed lines */
  .speedline {
    position: absolute; height: 3px; background: rgba(255,255,255,0.85);
    border-radius: 3px; pointer-events: none;
    animation: speedfade .5s ease-out forwards;
  }
  @keyframes speedfade { 0%{opacity:1;transform:scaleX(1);} 100%{opacity:0;transform:scaleX(.3);} }

  .home-btn {
    position: absolute; top: 10px; left: 10px;
    background: #fffdfa; border: 2px solid var(--ink);
    border-radius: 14px; padding: 6px 12px;
    font-family: inherit; font-size: 16px;
    cursor: pointer; z-index: 5;
    box-shadow: 0 3px 0 rgba(42,39,48,0.2);
  }
  .home-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(42,39,48,0.2); }

  .audio-toggle {
    position: absolute; top: 10px; right: 10px;
    background: #fffdfa; border: 2px solid var(--ink);
    border-radius: 999px; width: 38px; height: 38px;
    cursor: pointer; z-index: 5;
    box-shadow: 0 3px 0 rgba(42,39,48,0.2);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .audio-toggle:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(42,39,48,0.2); }

  .final h2 {
    font-size: clamp(28px, 5vw, 40px);
    color: var(--pink-deep); text-align: center;
    margin: 4px 0 14px; text-shadow: 3px 3px 0 var(--yellow);
  }
  .final .row { display: flex; justify-content: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }

  .footer-note {
    text-align: center; font-size: 14px; margin-top: 14px;
    color: rgba(42,39,48,0.6);
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- Inline character SVG factory uses these gradient defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Skin gradient -->
    <radialGradient id="g-skin" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#ffe6d4"/>
      <stop offset="60%" stop-color="#fbd0b1"/>
      <stop offset="100%" stop-color="#e8a884"/>
    </radialGradient>
    <!-- Margot's hair: honey at root, lighter blonde at tips -->
    <linearGradient id="g-hair-margot" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c8973f"/>
      <stop offset="40%" stop-color="#e7be63"/>
      <stop offset="100%" stop-color="#f7dd97"/>
    </linearGradient>
    <!-- Luca's hair: golden sandy blonde -->
    <linearGradient id="g-hair-luca" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a47a3c"/>
      <stop offset="60%" stop-color="#c89a5a"/>
      <stop offset="100%" stop-color="#e0bf80"/>
    </linearGradient>
    <!-- Sonny's hair: light golden blonde -->
    <linearGradient id="g-hair-sonny" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#b58c4a"/>
      <stop offset="60%" stop-color="#dfb56a"/>
      <stop offset="100%" stop-color="#f3d997"/>
    </linearGradient>
    <!-- Generic shirt highlight -->
    <linearGradient id="g-shirt" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="g-grass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8ed378"/>
      <stop offset="100%" stop-color="#5aa849"/>
    </linearGradient>
    <linearGradient id="g-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a5d8ff"/>
      <stop offset="100%" stop-color="#eaf6ff"/>
    </linearGradient>
    <linearGradient id="g-ice" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d1e8f5"/>
      <stop offset="100%" stop-color="#f5fbff"/>
    </linearGradient>
    <linearGradient id="g-wood" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c9b289"/>
      <stop offset="100%" stop-color="#a07a52"/>
    </linearGradient>
    <radialGradient id="g-spotlight" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="rgba(255,255,210,0.5)"/>
      <stop offset="80%" stop-color="rgba(255,255,210,0)"/>
    </radialGradient>
  </defs>
</svg>

<script>
//////////////////////////////////////////////////////////////
// AUDIO ENGINE
//////////////////////////////////////////////////////////////
const Audio = (() => {
  let ctx = null;
  let muted = false;
  let musicGain = null;
  let musicNode = null;
  let started = false;

  function ensure() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (c && c.state === 'suspended') c.resume();
    started = true;
  }

  function setMuted(v) {
    muted = v;
    if (musicGain) musicGain.gain.setTargetAtTime(muted ? 0 : 0.18, ensure().currentTime, 0.05);
  }
  function isMuted() { return muted; }

  // ---- SFX synth helpers ----
  function envGain(c, t0, peak, attack, hold, release) {
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + attack);
    g.gain.linearRampToValueAtTime(peak, t0 + attack + hold);
    g.gain.linearRampToValueAtTime(0, t0 + attack + hold + release);
    return g;
  }

  function whistle() {
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(1800, t);
    o.frequency.linearRampToValueAtTime(2400, t + 0.18);
    const g = envGain(c, t, 0.18, 0.01, 0.16, 0.05);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + 0.25);
  }

  function kick() {
    // soccer kick: noise burst + low thump
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime;
    const noise = c.createBufferSource();
    const buf = c.createBuffer(1, c.sampleRate * 0.08, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    noise.buffer = buf;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
    const ng = envGain(c, t, 0.6, 0.005, 0.02, 0.06);
    noise.connect(lp).connect(ng).connect(c.destination);
    noise.start(t); noise.stop(t + 0.08);

    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    const og = envGain(c, t, 0.4, 0.005, 0.04, 0.08);
    o.connect(og).connect(c.destination);
    o.start(t); o.stop(t + 0.15);
  }

  function trap() {
    // softer thump
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime;
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(80, t + 0.08);
    const g = envGain(c, t, 0.25, 0.003, 0.02, 0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + 0.1);
  }

  function slap() {
    // hockey slapshot: hard snap
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime;
    const noise = c.createBufferSource();
    const buf = c.createBuffer(1, c.sampleRate * 0.05, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
    noise.buffer = buf;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
    const ng = envGain(c, t, 0.55, 0.001, 0.01, 0.04);
    noise.connect(hp).connect(ng).connect(c.destination);
    noise.start(t); noise.stop(t + 0.06);
    // crack
    const o = c.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.06);
    const og = envGain(c, t, 0.18, 0.001, 0.01, 0.06);
    o.connect(og).connect(c.destination);
    o.start(t); o.stop(t + 0.08);
  }

  function net() {
    // rope/net ripple — short noise burst with bandpass
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime;
    const noise = c.createBufferSource();
    const buf = c.createBuffer(1, c.sampleRate * 0.4, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    noise.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 2500; bp.Q.value = 1.2;
    const ng = envGain(c, t, 0.32, 0.005, 0.05, 0.3);
    noise.connect(bp).connect(ng).connect(c.destination);
    noise.start(t); noise.stop(t + 0.4);
  }

  function airhorn() {
    // goal horn
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime;
    [220, 277, 330].forEach((f, i) => {
      const o = c.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t);
      const g = envGain(c, t + i * 0.02, 0.18, 0.02, 0.6, 0.3);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t + 1.0);
    });
  }

  function cheer() {
    // crowd cheer — pink-noise envelope w/ slight pitch wobble
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime;
    const dur = 1.4;
    const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
    const data = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < data.length; i++) {
      const w = (Math.random() * 2 - 1);
      b0 = 0.99765 * b0 + w * 0.0990460;
      b1 = 0.96300 * b1 + w * 0.2965164;
      b2 = 0.57000 * b2 + w * 1.0526913;
      data[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18;
    }
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.setValueAtTime(900, t);
    bp.frequency.linearRampToValueAtTime(1800, t + 0.4);
    bp.Q.value = 0.6;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.6, t + 0.18);
    g.gain.linearRampToValueAtTime(0.4, t + 0.7);
    g.gain.linearRampToValueAtTime(0, t + dur);
    src.connect(bp).connect(g).connect(c.destination);
    src.start(t); src.stop(t + dur);
  }

  function pop() {
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime;
    const o = c.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(800, t);
    o.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
    const g = envGain(c, t, 0.16, 0.003, 0.02, 0.06);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + 0.1);
  }

  // Background music: simple ukulele-feel arpeggio loop
  function startMusic() {
    const c = ensure(); if (!c || musicNode) return;
    const tempo = 120;
    const beat = 60 / tempo;
    musicGain = c.createGain();
    musicGain.gain.value = muted ? 0 : 0.18;
    musicGain.connect(c.destination);

    // Pluck-like synth: short triangle with quick decay
    function pluck(freq, t, dur = beat * 0.45, vel = 1) {
      const o = c.createOscillator();
      o.type = 'triangle';
      o.frequency.value = freq;
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.22 * vel, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(musicGain);
      o.start(t); o.stop(t + dur);
      // soft second harmonic
      const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
      const g2 = c.createGain();
      g2.gain.setValueAtTime(0, t);
      g2.gain.linearRampToValueAtTime(0.07 * vel, t + 0.005);
      g2.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.7);
      o2.connect(g2).connect(musicGain);
      o2.start(t); o2.stop(t + dur);
    }

    // Chord progression: C major - Am - F - G (kid-friendly, warm)
    // Each chord = 4 beats of arpeggio
    const chords = [
      [262, 330, 392, 523], // C
      [220, 262, 330, 440], // Am
      [175, 262, 349, 440], // F
      [196, 247, 294, 392], // G
    ];

    function scheduleLoop() {
      const start = c.currentTime + 0.05;
      const loopDur = chords.length * 4 * beat;
      chords.forEach((ch, ci) => {
        const baseT = start + ci * 4 * beat;
        // 8th-note alternating arpeggio: 0 2 1 3 0 2 1 3
        const order = [0, 2, 1, 3, 0, 2, 1, 3];
        order.forEach((idx, i) => {
          const t = baseT + i * 0.5 * beat;
          pluck(ch[idx], t, beat * 0.5, i % 2 === 0 ? 1 : 0.7);
        });
      });
      musicNode = setTimeout(scheduleLoop, loopDur * 1000 - 50);
    }
    scheduleLoop();
  }

  function stopMusic() {
    if (musicNode) { clearTimeout(musicNode); musicNode = null; }
    if (musicGain) { try { musicGain.disconnect(); } catch (e) {} musicGain = null; }
  }

  // Voice clip support: returns true if played
  const voiceCache = {};
  function tryVoice(name) {
    if (muted) return false;
    if (voiceCache[name] === false) return false;
    let a = voiceCache[name];
    if (!a) {
      a = new window.Audio('audio/' + name + '.mp3');
      a.preload = 'auto';
      a.addEventListener('error', () => { voiceCache[name] = false; });
      voiceCache[name] = a;
    }
    try {
      a.currentTime = 0;
      const p = a.play();
      if (p && p.then) p.catch(() => { voiceCache[name] = false; });
      return true;
    } catch (e) { return false; }
  }

  return {
    unlock, setMuted, isMuted,
    whistle, kick, trap, slap, net, airhorn, cheer, pop,
    startMusic, stopMusic, tryVoice,
  };
})();

// Unlock on first user gesture
document.addEventListener('pointerdown', () => Audio.unlock(), { once: true });

// HELPERS
//////////////////////////////////////////////////////////////
function el(tag, props = {}, children = []) {
  const ns = (tag === 'svg' || tag === 'g' || tag === 'path' || tag === 'rect' || tag === 'circle' || tag === 'ellipse' || tag === 'line' || tag === 'polygon' || tag === 'text');
  const n = ns ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag);
  for (const k in props) {
    const v = props[k];
    if (v == null) continue;
    if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else if (k === 'class') n.setAttribute('class', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}
function svg(html) {
  const wrap = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  wrap.innerHTML = html;
  return wrap;
}
function div(cls, props = {}) { return el('div', { class: cls, ...props }); }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

//////////////////////////////////////////////////////////////
// CHARACTER SYSTEM (rigged SVG, animatable per-instance)
//////////////////////////////////////////////////////////////
// Characters are drawn at viewBox 200x300.
// Origin: feet at y=300, body centered horizontally at x=100.
// Rig groups (so animations can target):
//   .body-rig (whole moving body, child of root)
//     .leg-l, .leg-r (rotate from hip, top of group)
//     .torso (with shirt)
//     .arm-l, .arm-r (rotate from shoulder)
//     .head (with hair, eyes, mouth)

function colorFor(kid) {
  return kid === 'margot' ? { primary: '#e23b3b', primaryDark: '#a82626', pants: '#d4302f' }
       : kid === 'luca'   ? { primary: '#ff8a2a', primaryDark: '#c25c00', pants: '#3a3a6a' }
                          : { primary: '#ffd23a', primaryDark: '#c89400', pants: '#5b6db0' };
}

function makeKid(kid, opts = {}) {
  const c = colorFor(kid);
  const heightScale = kid === 'margot' ? 1.0 : kid === 'luca' ? 0.86 : 0.7;
  const bodyHeight = 280 * heightScale;
  const bodyWidth  = 200;

  const root = el('div', { class: 'actor idle ' + kid + (opts.flip ? ' flipx' : '') });
  if (opts.flip) root.style.transform = 'scaleX(-1)';
  root.style.width = (12 * heightScale) + '%';
  root.style.left = opts.x ?? '40%';
  root.style.bottom = opts.bottom ?? '6%';
  root.style.zIndex = opts.z ?? 1;

  const HEAD = headFor(kid);
  const TORSO = torsoFor(kid, c);

  const inner = `
  <svg viewBox="0 0 200 300" preserveAspectRatio="xMidYEnd meet">
    <g class="body-rig">
      <!-- back leg first so front leg overlaps -->
      <g class="leg-l" transform="translate(85 175)">
        <rect x="-12" y="0" width="24" height="80" rx="10" fill="${c.pants}"/>
        <rect x="-12" y="0" width="24" height="20" fill="rgba(0,0,0,0.12)"/>
        <ellipse cx="0" cy="86" rx="16" ry="8" fill="#222"/>
      </g>
      <g class="leg-r" transform="translate(115 175)">
        <rect x="-12" y="0" width="24" height="80" rx="10" fill="${c.pants}"/>
        <rect x="-12" y="0" width="24" height="20" fill="rgba(0,0,0,0.12)"/>
        <ellipse cx="0" cy="86" rx="16" ry="8" fill="#222"/>
      </g>

      ${TORSO}

      <!-- arms, behind torso for back arm, in front for front arm -->
      <g class="arm-l" transform="translate(70 80)">
        <rect x="-9" y="0" width="18" height="70" rx="8" fill="${c.primary}"/>
        <rect x="-9" y="0" width="18" height="14" fill="rgba(0,0,0,0.15)"/>
        <circle cx="0" cy="74" r="10" fill="url(#g-skin)" stroke="#2a2730" stroke-width="2"/>
      </g>
      <g class="arm-r" transform="translate(130 80)">
        <rect x="-9" y="0" width="18" height="70" rx="8" fill="${c.primary}"/>
        <rect x="-9" y="0" width="18" height="14" fill="rgba(0,0,0,0.15)"/>
        <circle cx="0" cy="74" r="10" fill="url(#g-skin)" stroke="#2a2730" stroke-width="2"/>
      </g>

      ${HEAD}
    </g>
  </svg>`;
  root.innerHTML = inner;

  // helpers attached to instance
  root.kid = kid;
  root.setPose = (pose) => {
    root.classList.remove('idle','running','cheer','wobble','spin','windup');
    root.classList.add(pose);
  };
  root.setFace = (face) => {
    if (face) root.dataset.face = face;
    else root.removeAttribute('data-face');
  };
  root.flashFace = (face, ms = 600) => {
    root.dataset.face = face;
    setTimeout(() => { if (root.dataset.face === face) root.removeAttribute('data-face'); }, ms);
  };
  root.flip = (yes) => {
    root.style.transform = yes ? 'scaleX(-1)' : '';
  };
  root.moveTo = (xPct, opts2 = {}) => {
    if (opts2.duration != null) root.style.transition = `left ${opts2.duration}ms ${opts2.easing || 'cubic-bezier(.4,0,.2,1)'}, bottom ${opts2.duration}ms ${opts2.easing || 'cubic-bezier(.4,0,.2,1)'}`;
    root.style.left = xPct;
    return delay(opts2.duration ?? 400);
  };
  return root;
}

// SCENE / TIMELINE PRIMITIVES
//////////////////////////////////////////////////////////////
// Each "scene" is now a function that builds the stage and runs
// a choreography — choices appear after the choreography or at
// natural decision points.

function makeStage() {
  const stage = el('div', { class: 'stage' });
  return stage;
}

function homeButton() {
  return el('button', { class: 'home-btn', onClick: home }, '← Home');
}
function audioButton() {
  const b = el('button', { class: 'audio-toggle', title: 'Toggle sound', onClick: () => {
    Audio.setMuted(!Audio.isMuted());
    b.textContent = Audio.isMuted() ? '🔇' : '🔊';
  } });
  b.textContent = Audio.isMuted() ? '🔇' : '🔊';
  return b;
}

function speech(parent, text, x, y, cls = '') {
  const b = el('div', { class: 'bubble ' + cls, text });
  b.style.left = x; b.style.top = y;
  parent.appendChild(b);
  Audio.pop();
  return b;
}

function speedlines(parent, x, y, count = 5) {
  for (let i = 0; i < count; i++) {
    const sl = el('div', { class: 'speedline' });
    sl.style.left = x;
    sl.style.top = (parseFloat(y) + i * 1.2) + '%';
    sl.style.width = (60 + Math.random() * 40) + 'px';
    sl.style.animationDelay = (i * 30) + 'ms';
    parent.appendChild(sl);
    setTimeout(() => sl.remove(), 600);
  }
}

function makePanel({ dialogue, choices, onChoice }) {
  const panel = el('div', { class: 'panel' });
  panel.appendChild(el('div', { class: 'dialogue', text: dialogue || '' }));
  const wrap = el('div', { class: 'choices' });
  (choices || []).forEach((label, i) => {
    const btn = el('button', {
      class: 'choice' + (i % 2 ? ' alt' : ''),
      onClick: () => onChoice(i, label),
    }, label);
    wrap.appendChild(btn);
  });
  panel.appendChild(wrap);
  return panel;
}

//////////////////////////////////////////////////////////////
// SOCCER ADVENTURE — choreographed
//////////////////////////////////////////////////////////////
async function playSoccer() {
  // ----- Scene 1: take the field, then a real pass-and-trap -----
  const stage = makeStage();
  stage.innerHTML = bgSoccer();
  stage.appendChild(homeButton());
  stage.appendChild(audioButton());

  // place actors
  const margot = makeKid('margot', { x: '4%',  bottom: '8%' });
  const luca   = makeKid('luca',   { x: '34%', bottom: '8%' });
  const sonny  = makeKid('sonny',  { x: '64%', bottom: '8%' });
  // increase sizes a touch
  margot.style.width = '15%';
  luca.style.width   = '13%';
  sonny.style.width  = '11%';
  stage.append(margot, luca, sonny);

  // panel mounts dynamically
  const panelHost = div('panel-host');
  const card = el('div', { class: 'card' }, [stage, panelHost]);
  app.innerHTML = ''; app.appendChild(card);

  // step 1: kids run toward center together
  margot.setPose('running'); luca.setPose('running'); sonny.setPose('running');
  speech(stage, "Let's play, Mom!", '6%', '14%');
  await Promise.all([
    margot.moveTo('14%', { duration: 1200 }),
    luca.moveTo('38%',   { duration: 1200 }),
    sonny.moveTo('60%',  { duration: 1200 }),
  ]);
  margot.setPose('idle'); luca.setPose('idle'); sonny.setPose('idle');
  Audio.whistle();
  await delay(400);

  // ask first choice
  const choice1 = await new Promise(res => {
    panelHost.replaceChildren(makePanel({
      dialogue: "Margot has the ball. Who should she pass to?",
      choices: ['Pass to Luca', 'Pass to Sonny'],
      onChoice: i => res(i),
    }));
  });
  // remove panel during choreography
  panelHost.replaceChildren();

  const receiver = (choice1 === 0) ? luca : sonny;
  const receiverName = (choice1 === 0) ? 'luca' : 'sonny';

  // ---------- PASS CHOREOGRAPHY ----------
  // Margot turns to face receiver, plants foot, swings, kicks. Ball arcs.
  // Receiver runs in, traps, controls.

  // create ball at margot's feet
  const ball = el('div', { class: 'ball' });
  const ballShadow = el('div', { class: 'ball-shadow' });
  stage.appendChild(ballShadow);
  stage.appendChild(ball);
  function placeBall(xPct, yPct, shadowYPct) {
    ball.style.left = xPct; ball.style.top = yPct;
    ballShadow.style.left = xPct;
    ballShadow.style.top = (shadowYPct ?? '88%');
  }
  placeBall('19%', '82%', '88%');

  // wind-up: temporarily inject inline keyframes on margot's right leg
  const margotLegR = margot.querySelector('.leg-r');
  margotLegR.animate([
    { transform: 'rotate(0deg)' },
    { transform: 'rotate(-50deg)' },
  ], { duration: 350, fill: 'forwards', easing: 'ease-out' });
  await delay(350);

  Audio.kick();
  // foot snaps forward
  margotLegR.animate([
    { transform: 'rotate(-50deg)' },
    { transform: 'rotate(45deg)' },
    { transform: 'rotate(10deg)' },
  ], { duration: 220, fill: 'forwards', easing: 'cubic-bezier(.2,.8,.4,1)' });

  // ball flies in arc toward receiver position
  const startLeftPct = 19;
  const endLeftPct = (receiverName === 'luca') ? 41 : 63;
  const startTopPct = 82, peakTopPct = 50, endTopPct = 80;
  const flightMs = 800;
  const startTime = performance.now();
  // animate ball + shadow with rAF
  await new Promise(resolve => {
    function tick(now) {
      const t = Math.min(1, (now - startTime) / flightMs);
      const x = startLeftPct + (endLeftPct - startLeftPct) * t;
      // quadratic for arc
      const y = startTopPct + (endTopPct - startTopPct) * t - 4 * (peakTopPct - startTopPct) * t * (1 - t) * -1;
      // simpler: parabola from start to end with peak
      const arcY = (1 - t) * startTopPct + t * endTopPct - Math.sin(Math.PI * t) * (startTopPct - peakTopPct);
      ball.style.left = x + '%';
      ball.style.top  = arcY + '%';
      ball.style.transform = `rotate(${t * 720}deg)`;
      // shadow tracks horizontal only, scales with height
      ballShadow.style.left = x + '%';
      ballShadow.style.transform = `scale(${1 - 0.3 * Math.sin(Math.PI * t)})`;
      ballShadow.style.opacity = 0.4 - 0.2 * Math.sin(Math.PI * t);
      speedlines(stage, (x + 2) + '%', (arcY + 1) + '%', 1);
      if (t < 1) requestAnimationFrame(tick); else resolve();
    }
    requestAnimationFrame(tick);
  });

  // restore margot's leg
  margotLegR.animate([{ transform: 'rotate(10deg)' }, { transform: 'rotate(0deg)' }], { duration: 250, fill: 'forwards' });

  // receiver: trap animation — pull foot back as ball arrives
  Audio.trap();
  const recvLegR = receiver.querySelector('.leg-r');
  recvLegR.animate([
    { transform: 'rotate(0deg)' },
    { transform: 'rotate(-22deg)' },
    { transform: 'rotate(0deg)' },
  ], { duration: 400, fill: 'forwards' });
  // stick ball at receiver's foot
  placeBall((endLeftPct + 0.5) + '%', '82%', '88%');
  speech(stage, 'Got it!', (endLeftPct - 4) + '%', '14%', 'small');
  await delay(500);

  // dribble a step toward goal (left) — receiver runs left with ball
  receiver.setPose('running');
  const dribbleEndPct = Math.max(20, endLeftPct - 18);
  const dribStart = performance.now();
  const dribDur = 1100;
  await new Promise(resolve => {
    function tick(now) {
      const t = Math.min(1, (now - dribStart) / dribDur);
      const x = endLeftPct + (dribbleEndPct - endLeftPct) * t;
      receiver.style.left = x + '%';
      // ball bounces along
      const bounceY = 82 - Math.abs(Math.sin(t * Math.PI * 6)) * 4;
      placeBall((x + 2) + '%', bounceY + '%', '88%');
      if (t < 1) requestAnimationFrame(tick); else resolve();
    }
    requestAnimationFrame(tick);
  });
  receiver.setPose('idle');
  await delay(200);

  // ---------- Scene 2: choose to shoot or pass back ----------
  const choice2 = await new Promise(res => {
    panelHost.replaceChildren(makePanel({
      dialogue: receiverName === 'luca'
        ? "Luca's eyeing the goal. What now?"
        : "Sonny dribbled it (kind of)! What now?",
      choices: ['SHOOT!', 'Pass back to Margot'],
      onChoice: i => res(i),
    }));
  });
  panelHost.replaceChildren();

  if (choice2 === 1) {
    // pass back to Margot, then she shoots
    Audio.kick();
    const recv2 = receiver.querySelector('.leg-r');
    recv2.animate([{ transform:'rotate(0)'}, {transform:'rotate(-40deg)'}, {transform:'rotate(35deg)'}, {transform:'rotate(0)'}], { duration: 500, fill: 'forwards' });
    // ball back to Margot
    const fromX = parseFloat(receiver.style.left);
    const toX = parseFloat(margot.style.left);
    await arcBall(stage, ball, ballShadow, fromX + 2, toX + 2, 800);
    Audio.trap();
    placeBall((toX + 2) + '%', '82%', '88%');
    await delay(300);
  }

  // SHOOT: Margot or receiver winds up and SHOOTS toward goal
  const shooter = (choice2 === 1) ? margot : receiver;
  const shooterLeg = shooter.querySelector('.leg-r');
  shooter.flashFace('effort', 600);
  shooterLeg.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-65deg)' }], { duration: 320, fill: 'forwards', easing: 'ease-out' });
  await delay(320);
  Audio.kick();
  shooterLeg.animate([{ transform: 'rotate(-65deg)' }, { transform: 'rotate(55deg)' }, { transform: 'rotate(0deg)' }], { duration: 280, fill: 'forwards', easing: 'cubic-bezier(.2,.8,.4,1)' });

  // ball flies fast and low to goal (goal is far left ~7-15%)
  const goalX = 11;
  const sFromX = parseFloat(shooter.style.left) + 2;
  await arcBall(stage, ball, ballShadow, sFromX, goalX, 600, 30);
  Audio.net();
  // surprise reactions + camera shake on impact
  margot.flashFace('surprise', 500);
  luca.flashFace('surprise', 500);
  sonny.flashFace('surprise', 500);
  stage.classList.add('cam-shake');
  setTimeout(() => stage.classList.remove('cam-shake'), 700);
  // impact flash overlay
  const impact = el('div', { class: 'impact-flash' });
  stage.appendChild(impact);
  setTimeout(() => impact.remove(), 400);
  // brief net ripple — flash goal area
  const flash = el('div'); Object.assign(flash.style, { position:'absolute', left:'5%', top:'58%', width:'18%', height:'18%', background:'rgba(255,255,255,0.4)', borderRadius:'10px' });
  stage.appendChild(flash);
  setTimeout(() => flash.remove(), 200);
  await delay(250);

  // ---------- Scene 3: GOAL pile-up ----------
  Audio.airhorn();
  Audio.cheer();
  // all kids run toward goal, then cheer
  margot.setPose('running'); luca.setPose('running'); sonny.setPose('running');
  await Promise.all([
    margot.moveTo('22%', { duration: 900 }),
    luca.moveTo('32%',   { duration: 900 }),
    sonny.moveTo('42%',  { duration: 900 }),
  ]);
  margot.setPose('cheer'); luca.setPose('cheer'); sonny.setPose('cheer');
  // camera push-in for the celebration moment
  stage.classList.add('cam-pushin');
  setTimeout(() => stage.classList.remove('cam-pushin'), 3500);
  speech(stage, 'GOOOAL!', '24%', '8%', 'big');
  ball.remove(); ballShadow.remove();
  await delay(1400);

  // confetti burst
  const fx = el('div', { class: 'fx' });
  const colors = ['#ff6b9a','#ffd23a','#7fc46b','#7ec3ff','#e23b3b','#ff8a2a'];
  for (let i = 0; i < 22; i++) {
    const c = el('div', { class: 'conf' });
    c.style.left = (Math.random() * 100) + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * 1.2) + 's';
    c.style.animationDuration = (2.4 + Math.random() * 1.6) + 's';
    fx.appendChild(c);
  }
  stage.appendChild(fx);

  panelHost.replaceChildren(makePanel({
    dialogue: "GOOOAL!! The kids tumble into a cheering pile.",
    choices: ['Run to Mom! ❤'],
    onChoice: () => renderFinal(),
  }));
}

// helper: arc the ball with shadow over duration
function arcBall(stage, ball, shadow, fromXPct, toXPct, durMs, peakLift = 35) {
  const start = performance.now();
  const startTop = 82, peakTop = 82 - peakLift;
  return new Promise(resolve => {
    function tick(now) {
      const t = Math.min(1, (now - start) / durMs);
      const x = fromXPct + (toXPct - fromXPct) * t;
      const y = startTop - Math.sin(Math.PI * t) * (startTop - peakTop);
      ball.style.left = x + '%'; ball.style.top = y + '%';
      ball.style.transform = `rotate(${t * 720}deg)`;
      shadow.style.left = x + '%';
      shadow.style.top = '88%';
      shadow.style.opacity = 0.4 - 0.2 * Math.sin(Math.PI * t);
      shadow.style.transform = `scale(${1 - 0.4 * Math.sin(Math.PI * t)})`;
      // sparse speedlines
      if (Math.random() < 0.3) speedlines(stage, x + '%', (y - 1) + '%', 1);
      if (t < 1) requestAnimationFrame(tick); else resolve();
    }
    requestAnimationFrame(tick);
  });
}

    </g>

    <g fill="#ff6b9a">
      <rect x="120" y="200" width="40" height="26" transform="rotate(-8 140 213)"/>
      <rect x="500" y="195" width="44" height="26" transform="rotate(6 522 208)"/>

}

function hockeyGoal(x, y, w) {
  // returns an absolutely-positioned SVG goal element
  const g = el('div');
  g.style.cssText = `position:absolute; left:${x}; bottom:${y}; width:${w}; pointer-events:none;`;
  g.innerHTML = `<svg viewBox="0 0 200 160" style="width:100%;height:auto;overflow:visible">
    <!-- net depth -->
    <path d="M30 30 L170 30 L150 160 L50 160 Z" fill="rgba(255,255,255,0.4)" stroke="#222" stroke-width="3"/>
    <!-- frame -->
    <rect x="20" y="20" width="160" height="14" fill="#cf2030" stroke="#222" stroke-width="3"/>
    <rect x="14" y="20" width="14" height="140" fill="#cf2030" stroke="#222" stroke-width="3"/>
    <rect x="172" y="20" width="14" height="140" fill="#cf2030" stroke="#222" stroke-width="3"/>
    <!-- net mesh -->
    <g stroke="#fff" stroke-width="1.5" opacity=".75">
      ${Array.from({length: 10}).map((_,i)=>`<line x1="${34+i*14}" y1="34" x2="${54+i*12}" y2="158"/>`).join('')}
      ${Array.from({length: 7}).map((_,i)=>`<line x1="34" y1="${44+i*16}" x2="166" y2="${44+i*16}"/>`).join('')}
    </g>
  </svg>`;
  return g;
}

function hockeyStick(opts = {}) {
  // SVG hockey stick: shaft, blade, taped grip
  const wrap = el('div');
  const len = opts.len || 140;
  wrap.style.cssText = `position:absolute; left:${opts.left||'30%'}; bottom:${opts.bottom||'18%'}; width:${len}px; height:${len*1.2}px; transform-origin: 90% 90%; pointer-events:none; ${opts.transform ? 'transform:'+opts.transform : ''};`;
  wrap.innerHTML = `<svg viewBox="0 0 100 130" style="width:100%;height:100%;overflow:visible">
    <!-- shaft -->
    <rect x="44" y="0" width="10" height="100" fill="#2c2417" stroke="#000" stroke-width="1.5" rx="2"/>
    <!-- taped grip top -->
    <rect x="42" y="0" width="14" height="20" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
    <g stroke="#fff" stroke-width="0.6" opacity=".5">
      <line x1="42" y1="3" x2="56" y2="6"/>
      <line x1="42" y1="9" x2="56" y2="12"/>
      <line x1="42" y1="15" x2="56" y2="18"/>
    </g>
    <!-- blade (curved hockey blade) -->
    <path d="M44 100 L54 100 L78 122 Q80 126 76 128 L40 128 Q36 126 38 122 Z" fill="#3a2a18" stroke="#000" stroke-width="1.5"/>
    <!-- white tape on blade -->
    <path d="M44 110 L54 110 L72 122 L40 122 Z" fill="#f0f0f0" opacity=".75"/>
  </svg>`;
  return wrap;
}

function arcPuck(stage, puck, shadow, fromXPct, toXPct, durMs, lift) {
  const start = performance.now();
  const startTop = 74;
  return new Promise(resolve => {
    function tick(now) {
      const t = Math.min(1, (now - start) / durMs);
      const x = fromXPct + (toXPct - fromXPct) * t;
      const y = startTop - Math.sin(Math.PI * t) * lift;
      puck.style.left = x + '%'; puck.style.top = y + '%';
      shadow.style.left = x + '%'; shadow.style.top = '78%';
      shadow.style.opacity = 0.4 - 0.2 * Math.sin(Math.PI * t);
      shadow.style.transform = `scale(${1 - 0.4 * Math.sin(Math.PI * t)})`;
      if (Math.random() < 0.4) speedlines(stage, x + '%', (y - 1) + '%', 1);
      if (t < 1) requestAnimationFrame(tick); else resolve();
    }
    requestAnimationFrame(tick);
  });
}

//////////////////////////////////////////////////////////////
// FINAL CHEER
//////////////////////////////////////////////////////////////
function renderFinal() {
  app.innerHTML = '';
  const stage = makeStage();
  stage.style.background = 'linear-gradient(180deg, #ffd9e6 0%, #fff3df 100%)';
  stage.appendChild(homeButton());
  stage.appendChild(audioButton());

  const margot = makeKid('margot', { x: '12%', bottom: '8%' });
  const luca   = makeKid('luca',   { x: '40%', bottom: '8%' });
  const sonny  = makeKid('sonny',  { x: '68%', bottom: '8%' });
  margot.style.width = '18%'; luca.style.width = '15%'; sonny.style.width = '13%';
  stage.append(margot, luca, sonny);
  margot.setPose('cheer'); luca.setPose('cheer'); sonny.setPose('cheer');

  // slow camera push-in for the finale
  stage.classList.add('cam-pushin');

  // bubble sequence + voice clips
  const bubbles = el('div', { class: 'bubbles' });
  stage.appendChild(bubbles);
  function delayedBubble(text, x, y, ms, cls = '') {
    setTimeout(() => {
      const b = el('div', { class: 'bubble ' + cls, text });
      b.style.left = x; b.style.top = y;
      bubbles.appendChild(b);
      Audio.pop();
    }, ms);
  }
  delayedBubble('I',     '14%', '12%',  300);
  delayedBubble('LOVE',  '40%',  '8%',  900);
  delayedBubble('YOU!',  '66%', '12%', 1500);
  setTimeout(() => Audio.cheer(), 1500);

  // voice clips: try to play each kid in sequence; falls through silently if missing
  setTimeout(() => Audio.tryVoice('margot'), 350);
  setTimeout(() => Audio.tryVoice('luca'),   1900);
  setTimeout(() => Audio.tryVoice('sonny'),  3500);

  // big final bubble centered
  setTimeout(() => {
    const b = el('div', { class: 'bubble big', text: "HAPPY MOTHER'S DAY, MOM!" });
    b.style.left = '50%'; b.style.top = '36%';
    b.style.transformOrigin = 'center center';
    b.style.transform = 'translateX(-50%) scale(0)';
    b.style.animation = 'pop-center 360ms cubic-bezier(.18,1.3,.5,1) forwards';
    bubbles.appendChild(b);
    Audio.airhorn();
    // little camera shake when the big bubble lands
    stage.classList.add('cam-shake');
    setTimeout(() => stage.classList.remove('cam-shake'), 700);
  }, 2200);

  // inject pop-center keyframes once
  if (!document.getElementById('pop-center-style')) {
    const st = document.createElement('style');
    st.id = 'pop-center-style';
    st.textContent = `@keyframes pop-center {
      0% { transform: translateX(-50%) scale(0) translateY(8px); }
      70% { transform: translateX(-50%) scale(1.08) translateY(-2px); }
      100% { transform: translateX(-50%) scale(1) translateY(0); }
    }`;
    document.head.appendChild(st);
  }

  // hearts + confetti
  const fx = el('div', { class: 'fx' });
  const colors = ['#ff6b9a','#ffd23a','#7fc46b','#7ec3ff','#e23b3b','#ff8a2a'];
  for (let i = 0; i < 18; i++) {
    const h = el('div', { class: 'heart', text: '❤' });
    h.style.left = (Math.random() * 100) + '%';
    h.style.color = colors[i % colors.length];
    h.style.animationDelay = (Math.random() * 3) + 's';
    h.style.animationDuration = (2.8 + Math.random() * 2) + 's';
    fx.appendChild(h);
  }
  for (let i = 0; i < 30; i++) {
    const c = el('div', { class: 'conf' });
    c.style.left = (Math.random() * 100) + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * 3) + 's';
    c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    fx.appendChild(c);
  }
  stage.appendChild(fx);

  const panel = el('div', { class: 'panel final' });
  panel.appendChild(el('h2', { text: 'We love you SO much, Mom!' }));
  const row = el('div', { class: 'row' });
  row.appendChild(el('button', { class: 'big', onClick: home }, ['Play another adventure']));
  panel.appendChild(row);

  const card = el('div', { class: 'card' }, [stage, panel]);
  app.appendChild(card);
}

home();
