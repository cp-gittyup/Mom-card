<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Happy Mother's Day!</title>
<style>
  :root {
    --cream: #fff7ec;
    --ink: #2a2730;
    --pink: #ff6b9a;
    --pink-deep: #e3477a;
    --sky: #c9ecff;
    --grass: #7fc46b;
    --grass-dark: #5aa849;
    --mat: #f1d6b0;
    --ice: #e6f4fb;
    --ice-line: #b9d8e8;
    --skin: #fddcc4;
    --skin-shade: #f4c2a4;
    --hair-margot: #f1cf6b;
    --hair-margot-dark: #d3ad48;
    --hair-luca: #b8884a;
    --hair-luca-dark: #8c632f;
    --hair-sonny: #a07a52;
    --hair-sonny-dark: #7c5b39;
    --eye: #2c6fb0;
    --red: #e23b3b;
    --orange: #ff8a2a;
    --yellow: #ffd23a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "Marker Felt", "Comic Sans MS", "Chalkboard SE", "Bradley Hand", cursive, system-ui, sans-serif;
    min-height: 100%;
    overscroll-behavior: none;
  }
  body {
    background:
      radial-gradient(circle at 20% 10%, #ffe2ec 0, transparent 40%),
      radial-gradient(circle at 80% 90%, #ffeac2 0, transparent 40%),
      var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  #app {
    width: 100%;
    max-width: 820px;
  }
  .card {
    background: #fffdfa;
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 12px 0 rgba(42,39,48,0.12), 0 24px 60px rgba(42,39,48,0.18);
    overflow: hidden;
    position: relative;
  }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--sky);
    overflow: hidden;
  }
  .stage svg.bg, .stage svg.scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .panel {
    padding: 18px 18px 22px;
    background: #fffdfa;
    border-top: 4px solid var(--ink);
  }
  .dialogue {
    font-size: 22px;
    line-height: 1.25;
    text-align: center;
    margin: 4px 0 14px;
    min-height: 1.4em;
  }
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  button.choice, button.big {
    appearance: none;
    border: 3px solid var(--ink);
    background: var(--pink);
    color: #fff;
    font-family: inherit;
    font-size: 22px;
    padding: 14px 22px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--pink-deep);
    transition: transform 80ms ease, box-shadow 80ms ease;
    min-width: 160px;
  }
  button.choice:hover, button.big:hover { transform: translateY(-1px); }
  button.choice:active, button.big:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--pink-deep);
  }
  button.choice.alt {
    background: #ffd23a;
    color: var(--ink);
    box-shadow: 0 5px 0 #d9a800;
  }
  button.choice.alt:active { box-shadow: 0 2px 0 #d9a800; }

  /* ---------- Intro ---------- */
  .intro {
    text-align: center;
    padding: 28px 22px 32px;
  }
  .intro h1 {
    font-size: clamp(34px, 6vw, 54px);
    margin: 6px 0 4px;
    color: var(--pink-deep);
    text-shadow: 3px 3px 0 #ffd23a;
  }
  .intro h2 {
    font-size: clamp(20px, 3vw, 26px);
    margin: 0 0 18px;
    color: var(--ink);
    font-weight: normal;
  }
  .intro .picker {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }
  .pick {
    border: 3px solid var(--ink);
    border-radius: 22px;
    padding: 14px 10px 16px;
    background: #fffdfa;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(42,39,48,0.18);
    transition: transform 80ms ease, box-shadow 80ms ease, background 120ms ease;
    font-family: inherit;
    color: var(--ink);
  }
  .pick:hover { background: #fff3df; }
  .pick:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(42,39,48,0.18);
  }
  .pick svg { width: 100%; height: 110px; display: block; }
  .pick .label { font-size: 22px; margin-top: 6px; }

  /* ---------- Speech bubbles ---------- */
  .bubbles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .bubble {
    position: absolute;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 22px;
    padding: 10px 14px;
    font-size: 28px;
    font-weight: bold;
    color: var(--pink-deep);
    transform: scale(0);
    transform-origin: bottom center;
    animation: pop 360ms cubic-bezier(.18,1.3,.5,1) forwards;
    box-shadow: 0 4px 0 rgba(42,39,48,0.15);
    white-space: nowrap;
  }
  .bubble.big { font-size: 34px; color: var(--ink); }
  .bubble.small { font-size: 20px; }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -14px;
    left: 24px;
    width: 18px; height: 18px;
    background: #fff;
    border-right: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    transform: rotate(45deg);
  }
  @keyframes pop {
    0%   { transform: scale(0) translateY(8px); }
    70%  { transform: scale(1.08) translateY(-2px); }
    100% { transform: scale(1) translateY(0); }
  }

  /* ---------- Confetti / hearts ---------- */
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .heart, .conf {
    position: absolute;
    bottom: -40px;
    will-change: transform, opacity;
    animation: float 3.6s linear infinite;
  }
  .heart { font-size: 26px; }
  .conf { width: 10px; height: 14px; border-radius: 2px; }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
  }

  /* ---------- Character poses (CSS) ---------- */
  .char {
    position: absolute;
    width: 26%;
    bottom: 8%;
    transform-origin: 50% 100%;
  }
  .char svg { width: 100%; height: auto; display: block; overflow: visible; }
  .char.bob { animation: bob 1.6s ease-in-out infinite; }
  .char.run { animation: run 700ms ease-in-out infinite; }
  .char.spin { animation: spin 2.4s linear infinite; }
  .char.tumble { animation: tumble 1.2s ease-in-out infinite; }
  .char.wobble { animation: wobble 1.4s ease-in-out infinite; }
  .char.cheer { animation: cheer 900ms ease-in-out infinite; }
  .char.fall  { animation: fall 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  @keyframes run { 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-8px) rotate(2deg);} }
  @keyframes spin { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }
  @keyframes tumble { 0%{transform:rotate(0);} 50%{transform:rotate(180deg) translateX(-10px);} 100%{transform:rotate(360deg);} }
  @keyframes wobble { 0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(6deg);} }
  @keyframes cheer { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }
  @keyframes fall { 0%,80%{transform:rotate(0) translateY(0);} 90%{transform:rotate(20deg) translateY(8px);} 100%{transform:rotate(0) translateY(0);} }

  /* ---------- Ball / puck ---------- */
  .ball, .puck {
    position: absolute;
    bottom: 16%;
    width: 6%;
    aspect-ratio: 1/1;
  }
  .ball { background: radial-gradient(circle at 35% 35%, #fff 0 30%, #ddd 31% 60%, #999 61% 100%); border-radius: 50%; border: 2px solid #222; animation: roll 1.4s linear infinite; }
  .puck { background: #1a1a1a; border-radius: 40%; border: 2px solid #000; animation: slide 1.2s ease-in-out infinite; }
  @keyframes roll { 0%{transform:translateX(-30vw) rotate(0);} 100%{transform:translateX(30vw) rotate(720deg);} }
  @keyframes slide { 0%{transform:translateX(0);} 50%{transform:translateX(28vw);} 100%{transform:translateX(0);} }

  /* ---------- Final ---------- */
  .final h2 {
    font-size: clamp(28px, 5vw, 40px);
    color: var(--pink-deep);
    text-align: center;
    margin: 4px 0 14px;
    text-shadow: 3px 3px 0 #ffd23a;
  }
  .final .row { display:flex; justify-content:center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .footer-note {
    text-align:center;
    font-size: 14px;
    margin-top: 14px;
    color: rgba(42,39,48,0.6);
  }
  .home-btn {
    position: absolute;
    top: 10px; left: 10px;
    background: #fffdfa;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    z-index: 5;
    box-shadow: 0 3px 0 rgba(42,39,48,0.2);
  }
  .home-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(42,39,48,0.2); }
</style>
</head>
<body>
<div id="app"></div>

    <!-- Sonny: toddler proportions, big head, light brown bowl-ish hair -->

<script>
(() => {
  const app = document.getElementById('app');

  // Heights for poses — Margot tallest, Luca middle, Sonny smallest
  const HEIGHTS = { margot: 1.0, luca: 0.86, sonny: 0.7 };
  const ACCENT  = { margot: 'var(--red)', luca: 'var(--orange)', sonny: 'var(--yellow)' };

  // ----- helpers -----
  function el(tag, props = {}, children = []) {
    const n = document.createElement(tag);
    for (const k in props) {
      if (k === 'style' && typeof props[k] === 'object') Object.assign(n.style, props[k]);
      else if (k === 'class') n.className = props[k];
      else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), props[k]);
      else if (k === 'html') n.innerHTML = props[k];
      else n.setAttribute(k, props[k]);
    }
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if (c == null) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }

  function kid(id, opts = {}) {
    // opts: x ('20%'), bottom ('8%'), scale (number, multiplies HEIGHTS), accent (color), pose (class), flip (bool), rotate (deg)
    const scale = (opts.scale || 1) * HEIGHTS[id];
    const wrap = el('div', { class: 'char ' + (opts.pose || 'bob') });
    wrap.style.width = (26 * scale) + '%';
    wrap.style.left = opts.x ?? '0%';
    wrap.style.bottom = opts.bottom ?? '8%';
    wrap.style.color = opts.accent || ACCENT[id];
    if (opts.flip || opts.rotate) {
      wrap.style.transform = `${opts.flip ? 'scaleX(-1) ' : ''}${opts.rotate ? `rotate(${opts.rotate}deg)` : ''}`;
    }
    wrap.innerHTML = `<svg viewBox="0 0 100 180"><use href="#kid-${id}"/></svg>`;
    return wrap;
  }

  function bubble(text, x, y, cls = '') {
    const b = el('div', { class: 'bubble ' + cls }, text);
    b.style.left = x;
    b.style.top  = y;
    return b;
  }

  // ----- backgrounds -----
  function bgSoccer() {
    return `<svg class="bg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky1" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#bfe4ff"/><stop offset="1" stop-color="#eaf6ff"/>
        </linearGradient>
      </defs>
      <rect width="800" height="600" fill="url(#sky1)"/>
      <circle cx="120" cy="90" r="38" fill="#fff" opacity=".85"/>
      <circle cx="170" cy="80" r="28" fill="#fff" opacity=".85"/>
      <circle cx="660" cy="120" r="42" fill="#fff" opacity=".85"/>
      <rect y="360" width="800" height="240" fill="#7fc46b"/>
      <path d="M0 360 L800 360" stroke="#5aa849" stroke-width="3"/>
      <path d="M400 370 L400 600" stroke="#fff" stroke-width="3" opacity=".8"/>
      <circle cx="400" cy="450" r="40" stroke="#fff" stroke-width="3" fill="none" opacity=".8"/>
      <!-- goal -->
      <rect x="60" y="320" width="120" height="60" fill="none" stroke="#fff" stroke-width="4"/>
      <line x1="60" y1="320" x2="180" y2="380" stroke="#fff" stroke-width="2" opacity=".5"/>
    </svg>`;
  }
  function bgGym() {
    return `<svg class="bg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
      <rect width="800" height="600" fill="#cfe7f5"/>
      <rect y="0" width="800" height="380" fill="#e8d5b4"/>
      <rect y="380" width="800" height="220" fill="#f1d6b0"/>
      <rect x="0" y="360" width="800" height="20" fill="#c9b289"/>
      <!-- bunting -->
      <path d="M40 60 Q400 30 760 60" stroke="#e3477a" stroke-width="3" fill="none"/>
      <g fill="#ff6b9a"><polygon points="100,60 90,90 110,90"/><polygon points="220,68 210,98 230,98"/><polygon points="340,72 330,102 350,102"/><polygon points="460,72 450,102 470,102"/><polygon points="580,68 570,98 590,98"/><polygon points="700,60 690,90 710,90"/></g>
      <!-- balance beam in back -->
      <rect x="540" y="320" width="220" height="14" fill="#a87b4b"/>
      <rect x="556" y="334" width="6" height="40" fill="#7d5a35"/>
      <rect x="740" y="334" width="6" height="40" fill="#7d5a35"/>
    </svg>`;
  }
  function bgIce() {
    return `<svg class="bg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
      <rect width="800" height="600" fill="#dfeef7"/>
      <rect y="320" width="800" height="280" fill="#e6f4fb"/>
      <line x1="0" y1="320" x2="800" y2="320" stroke="#9bc1d4" stroke-width="3"/>
      <!-- rink lines -->
      <line x1="0" y1="430" x2="800" y2="430" stroke="#f08a8a" stroke-width="3" opacity=".7"/>
      <circle cx="400" cy="500" r="60" stroke="#7da9bd" stroke-width="3" fill="none"/>
      <!-- boards -->
      <rect y="312" width="800" height="10" fill="#fff" stroke="#444" stroke-width="2"/>
      <!-- crowd silhouettes -->
      <g fill="#5e4a72" opacity=".65">
        ${Array.from({length: 22}).map((_,i)=>`<circle cx="${20+i*36}" cy="280" r="14"/><rect x="${8+i*36}" y="290" width="24" height="22" rx="4"/>`).join('')}
      </g>
    </svg>`;
  }

  // ----- state machine -----
  const state = { adventure: null, sceneIndex: 0 };

  function go(adv) { state.adventure = adv; state.sceneIndex = 0; render(); }
  function next() {
    state.sceneIndex++;
    const list = SCENES[state.adventure];
    if (state.sceneIndex >= list.length) renderFinal();
    else render();
  }
  function home() { state.adventure = null; state.sceneIndex = 0; render(); }

  // ----- scene wrapper -----
  function renderScene(scene) {
    const stage = el('div', { class: 'stage' });
    stage.innerHTML = scene.bg();
    const homeBtn = el('button', { class: 'home-btn', onClick: home }, '← Home');
    stage.appendChild(homeBtn);
    scene.actors().forEach(a => stage.appendChild(a));
    if (scene.fx) scene.fx().forEach(f => stage.appendChild(f));
    if (scene.bubbles) {
      const wrap = el('div', { class: 'bubbles' });
      scene.bubbles().forEach((b, i) => {
        b.style.animationDelay = (i * 220) + 'ms';
        wrap.appendChild(b);
      });
      stage.appendChild(wrap);
    }
    const panel = el('div', { class: 'panel' });
    panel.appendChild(el('div', { class: 'dialogue' }, scene.dialogue));
    const choices = el('div', { class: 'choices' });
    scene.choices.forEach((c, i) => {
      choices.appendChild(el('button', {
        class: 'choice' + (i % 2 ? ' alt' : ''),
        onClick: () => { if (c.onPick) c.onPick(); next(); }
      }, c.label));
    });
    panel.appendChild(choices);
    const card = el('div', { class: 'card' }, [stage, panel]);
    return card;
  }

  // ----- intro -----
  function renderIntro() {
    app.innerHTML = '';
    const card = el('div', { class: 'card' });
    const intro = el('div', { class: 'intro' });
    intro.appendChild(el('h1', {}, "Happy Mother's Day!"));
    intro.appendChild(el('h2', {}, "Pick an adventure with Margot, Luca & Sonny ❤"));

    const picker = el('div', { class: 'picker' });

    function makePick(label, advKey, art) {
      const b = el('button', { class: 'pick', onClick: () => go(advKey) });
      b.innerHTML = art;
      b.appendChild(el('div', { class: 'label' }, label));
      return b;
    }

    picker.appendChild(makePick('Soccer', 'soccer', `
      <svg viewBox="0 0 200 110">
        <rect width="200" height="110" fill="#9fdc8a"/>
        <circle cx="100" cy="60" r="24" fill="#fff" stroke="#222" stroke-width="3"/>

      <svg viewBox="0 0 200 110">

    picker.appendChild(makePick('Ice & Hockey', 'ice', `

  // ----- final cheer -----
  function renderFinal() {
    app.innerHTML = '';
    const stage = el('div', { class: 'stage' });
    stage.style.background = 'linear-gradient(180deg, #ffd9e6 0%, #fff3df 100%)';
    const homeBtn = el('button', { class: 'home-btn', onClick: home }, '← Home');
    stage.appendChild(homeBtn);
    // three kids cheering
    [
      kid('margot', { x: '12%', bottom: '6%', pose: 'cheer', scale: 1.1 }),
      kid('luca',   { x: '40%', bottom: '6%', pose: 'cheer', scale: 1.1 }),
      kid('sonny',  { x: '68%', bottom: '6%', pose: 'cheer', scale: 1.1 }),
    ].forEach(c => stage.appendChild(c));

    // bubble sequence
    const bubbles = el('div', { class: 'bubbles' });
    const seq = [
      { text: 'I',     x: '14%', y: '10%', delay:   100 },
      { text: 'LOVE',  x: '40%', y:  '6%', delay:   600 },
      { text: 'YOU!',  x: '66%', y: '10%', delay:  1100 },
      { text: "HAPPY MOTHER'S DAY, MOM!", x: '50%', y: '32%', cls: 'big', delay: 1700, center: true },
    ];
    seq.forEach(s => {
      const b = bubble(s.text, s.x, s.y, s.cls || '');
      if (s.center) b.style.transform = 'translateX(-50%) scale(0)';
      b.style.animationDelay = s.delay + 'ms';
      if (s.center) {
        // override animation to keep the translate
        b.style.animation = 'pop-center 360ms cubic-bezier(.18,1.3,.5,1) forwards';
      }
      bubbles.appendChild(b);
    });
    // inject pop-center keyframes once
    if (!document.getElementById('pop-center-style')) {
      const st = document.createElement('style');
      st.id = 'pop-center-style';
      st.textContent = `@keyframes pop-center {
        0% { transform: translateX(-50%) scale(0) translateY(8px); }
        70% { transform: translateX(-50%) scale(1.08) translateY(-2px); }
        100% { transform: translateX(-50%) scale(1) translateY(0); }
      }`;
      document.head.appendChild(st);
    }
    stage.appendChild(bubbles);

    // hearts + confetti
    const fx = el('div', { class: 'fx' });
    const colors = ['#ff6b9a','#ffd23a','#7fc46b','#7ec3ff','#e23b3b','#ff8a2a'];
    for (let i = 0; i < 18; i++) {
      const h = el('div', { class: 'heart' }, '❤');
      h.style.left = (Math.random() * 100) + '%';
      h.style.color = colors[i % colors.length];
      h.style.animationDelay = (Math.random() * 3) + 's';
      h.style.animationDuration = (2.8 + Math.random() * 2) + 's';
      fx.appendChild(h);
    }
    for (let i = 0; i < 30; i++) {
      const c = el('div', { class: 'conf' });
      c.style.left = (Math.random() * 100) + '%';
      c.style.background = colors[i % colors.length];
      c.style.animationDelay = (Math.random() * 3) + 's';
      c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
      fx.appendChild(c);
    }
    stage.appendChild(fx);

    const panel = el('div', { class: 'panel final' });
    panel.appendChild(el('h2', {}, "We love you SO much, Mom!"));
    const row = el('div', { class: 'row' });
    row.appendChild(el('button', { class: 'big', onClick: home }, 'Play another adventure'));
    panel.appendChild(row);

    const card = el('div', { class: 'card' }, [stage, panel]);
    app.appendChild(card);
  }

  // ----- main render -----
  function render() {
    if (!state.adventure) { renderIntro(); return; }
    const list = SCENES[state.adventure];
    const scene = list[state.sceneIndex];
    app.innerHTML = '';
    app.appendChild(renderScene(scene));
  }

  render();
})();
